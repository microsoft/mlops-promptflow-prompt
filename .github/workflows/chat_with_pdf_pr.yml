---
name: chat_with_pdf PR Workflow

on:
  workflow_call:
  pull_request:
    branches:
      - 'development'
    paths:
      - '.github/**'
      - 'mlops/common/**'
      - 'mlops/**'
      - 'flows/chat_with_pdf/**'
      - 'src/**'
      - 'tests/**'

permissions:
  id-token: write
  contents: read
jobs:
  run-pr-workflow:
    uses: ./.github/workflows/platform_pr_dev_workflow.yml
    with:
      exec_environment: 'pr'
      model_type: 'chat_with_pdf'
    secrets:
      aoai_api_key: ${{ secrets.AOAI_API_KEY }}
      aoai_base_endpoint: ${{ secrets.AOAI_BASE_ENDPOINT }}
      ACR_USER_NAME: ${{ secrets.ACR_USER_NAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}