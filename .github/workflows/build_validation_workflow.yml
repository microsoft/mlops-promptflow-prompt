---
name: Build Validation Workflow

on:
  workflow_call:
    secrets:
      ACR_USER_NAME:
        required: true
      ACR_PASSWORD:
        required: true

jobs:
  run-unit-tests:
    runs-on: ubuntu-latest
    container:
      image: aipfacr.azurecr.io/devops_container_image:latest
      options: --user root
      credentials:
          username: ${{ secrets.ACR_USER_NAME }}
          password: ${{ secrets.ACR_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v1

      - name: Lint Code
        run: flake8

      - name: Run Unit Tests
        shell: bash
        run: |
          pytest --junitxml=junit/test-results.xml --cov=. --cov-report=xml

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-*.xml"
